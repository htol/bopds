name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A superseded release build is canceled: only the newest tag should reach the registry
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  wait-for-ci:
    name: Wait for CI on the tagged commit
    # Runs on a GitHub-hosted runner: it must not occupy the single
    # self-hosted runner while the CI jobs it waits for are queued on it
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Poll CI status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          # Waits for the CI workflow run on the tagged commit to finish.
          # Fails if CI failed or never appeared (e.g. a tag pointing at a
          # commit that was never pushed to main).
          for i in $(seq 1 60); do
            state=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" --jq '
              [.workflow_runs[] | select(.name == "CI")] |
              if length == 0 then "absent"
              elif (map(.status != "completed") | any) then "running"
              elif (map(.conclusion == "success") | all) then "success"
              else "failed" end' 2>/dev/null || echo error)
            echo "attempt $i: CI is $state"
            case "$state" in
              success) exit 0 ;;
              failed) echo "CI failed on $SHA; refusing to release"; exit 1 ;;
            esac
            sleep 20
          done
          echo "Timed out waiting for CI on $SHA"; exit 1

  publish-docker:
    name: Publish Docker Image
    # Tag pushes are maintainer-only; build locally on the self-hosted runner
    runs-on: self-hosted
    needs: [wait-for-ci]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Git tag v0.1.5 -> image tags 0.1.5, 0.1, latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Enforce buildx cache limit (5 GB)
        run: |
          CACHE_DIR=/home/github-runner/.buildx-cache
          if [ -d "$CACHE_DIR" ]; then
            SIZE_MB=$(du -sm "$CACHE_DIR" | cut -f1)
            if [ "$SIZE_MB" -gt 5120 ]; then
              echo "Buildx cache is ${SIZE_MB} MB (> 5 GB), resetting it"
              rm -rf "$CACHE_DIR"
            fi
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Persistent layer cache on the self-hosted runner (keeps the emulated
          # arm64 production stage from rebuilding on every release)
          cache-from: type=local,src=/home/github-runner/.buildx-cache
          cache-to: type=local,dest=/home/github-runner/.buildx-cache,mode=max
