name: Release

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A superseded release build is canceled: only the newest tag should reach the registry
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  publish-docker:
    name: Publish Docker Image
    # Tag pushes are maintainer-only; build locally on the self-hosted runner
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Git tag v0.1.5 -> image tags 0.1.5, 0.1, latest
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Enforce buildx cache limit (5 GB)
        run: |
          CACHE_DIR=/home/github-runner/.buildx-cache
          if [ -d "$CACHE_DIR" ]; then
            SIZE_MB=$(du -sm "$CACHE_DIR" | cut -f1)
            if [ "$SIZE_MB" -gt 5120 ]; then
              echo "Buildx cache is ${SIZE_MB} MB (> 5 GB), resetting it"
              rm -rf "$CACHE_DIR"
            fi
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          # Persistent layer cache on the self-hosted runner (keeps the emulated
          # arm64 production stage from rebuilding on every release)
          cache-from: type=local,src=/home/github-runner/.buildx-cache
          cache-to: type=local,dest=/home/github-runner/.buildx-cache,mode=max
