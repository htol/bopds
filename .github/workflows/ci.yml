name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-commits:
    name: Lint Commit Messages
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      # Full history: the commit range spans many commits
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install commitlint
        run: npm install --no-save --no-package-lock @commitlint/cli@21.2.2 @commitlint/config-conventional@21.2.2

      - name: Lint commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
            if ! git rev-parse --verify --quiet "$BASE" >/dev/null; then
              echo "Base ref $BASE not available; skipping"
              exit 0
            fi
            FROM=$(git merge-base "$BASE" HEAD)
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            FROM=$BEFORE_SHA
          else
            echo "No commit range to lint (new branch or rewritten history); skipping"
            exit 0
          fi
          echo "Linting commits $FROM..HEAD"
          npx --no-install commitlint --from "$FROM" --to HEAD

  lint-backend:
    name: Lint Backend
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache: false

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1

  test-backend:
    name: Test Backend
    # Own pushes/PRs run on the self-hosted runner; fork PRs stay on GitHub-hosted runners
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          # Self-hosted runner keeps GOMODCACHE/GOCACHE on disk between runs;
          # the actions/cache round-trip (~200 MB per run) is pure overhead there
          cache: false

      - name: Install dependencies
        run: go mod download

      - name: Run Tests
        run: go test -v -tags "sqlite_omit_load_extension,fts5" ./...

  build-frontend:
    name: Build Frontend
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        run: npm run build

  build-docker:
    name: Build Docker Image
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    needs: [lint-commits, lint-backend, test-backend, build-frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # load: true exports the image into the runner's docker daemon
          # so the smoke test below can run it
          load: true
          tags: bopds:test

      - name: Smoke test the image
        run: |
          # The production image auto-creates its SQLite database on start,
          # so a plain container must serve /health without extra setup
          docker run -d --name bopds-smoke -p 127.0.0.1:8080:3001 bopds:test
          trap 'docker rm -f bopds-smoke >/dev/null 2>&1' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health | grep -q healthy; then
              echo "Container is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "Container did not become healthy in 30s"
          docker logs bopds-smoke
          exit 1
